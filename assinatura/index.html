<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivi MK - Assinatura Mensal</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 26px 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 2px solid #fbbf24;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #b45309;
    }

    p {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.3);
    }

    button {
      width: 100%;
      padding: 11px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(90deg, #f97316, #ea580c);
      cursor: pointer;
      margin-top: 6px;
    }

    button.secondary {
      background: linear-gradient(90deg, #22c55e, #16a34a);
      display: none;
      margin-top: 12px;
    }

    .msg {
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 18px;
    }

    .success { color: #15803d; }
    .error { color: #b91c1c; }

    small {
      display: block;
      margin-top: 14px;
      font-size: 0.72rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Assinatura Ivi MK</h1>
    <p>
      Digite o e-mail cadastrado na sua assinatura para liberar o acesso à sua mentora virtual.
    </p>

    <form id="access-form">
      <input
        type="email"
        id="email"
        placeholder="seuemail@exemplo.com"
        required
      />
      <button type="submit" id="validate-btn">Validar acesso</button>
    </form>

    <div id="message" class="msg"></div>

    <!-- BOTÃO QUE SÓ APARECE SE AUTORIZADO -->
    <a
      id="access-link"
      href="https://chatgpt.com/g/g-6924ec5fa3ec81919f6e0ec34bbe3e4d-iniciadora-virtual-mk"
      target="_blank"
      rel="noopener noreferrer"
    >
      <button class="secondary">
        👉 Acessar Ivi MK agora
      </button>
    </a>

    <small>
      💡 Dica: para melhor experiência, use o aplicativo do ChatGPT no celular.
    </small>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx8TAGgLV749zma8eO2UUqf-wZTIOxa_xQG_bTofcfAEhIIucoY3hYr3LCGBA82DS_a/exec";

    const form = document.getElementById("access-form");
    const emailInput = document.getElementById("email");
    const msgEl = document.getElementById("message");
    const accessBtn = document.querySelector(".secondary");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      if (!email) return;

      msgEl.textContent = "Verificando assinatura...";
      msgEl.className = "msg";

      try {
        const res = await fetch(`${SCRIPT_URL}?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.authorized) {
          msgEl.textContent = "✅ Acesso liberado! Clique no botão abaixo.";
          msgEl.className = "msg success";
          accessBtn.style.display = "block";
        } else {
          msgEl.textContent =
            data.message || "Este e-mail ainda não está autorizado.";
          msgEl.className = "msg error";
          accessBtn.style.display = "none";
        }
      } catch (err) {
        msgEl.textContent = "Erro ao validar. Tente novamente.";
        msgEl.className = "msg error";
      }
    });
  </script>
</body>
</html>
